<!DOCTYPE html>
<html>
<head>
    <title>Java Calculator</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 50px;
        }

        .calculator {
            width: 350px;
            margin: auto;
            border: 2px solid black;
            padding: 20px;
            border-radius: 10px;
        }

        input, select, button {
            width: 200px;
            padding: 8px;
            margin: 10px;
        }

        button {
            background-color: blue;
            color: white;
            cursor: pointer;
        }
    </style>

</head>

<body>

<div class="calculator">

    <h2>Java Calculator</h2>

    <form action="/calculate" method="post">

        <label>Number 1:</label><br>
        <input type="number" name="num1">
        <br>

        <label>Number 2:</label><br>
        <input type="number" name="num2">
        <br>

        <label>Operation:</label><br>

        <select name="operation">
            <option value="+">Add (+)</option>
            <option value="-">Subtract (-)</option>
            <option value="*">Multiply (*)</option>
            <option value="/">Divide (/)</option>
        </select>

        <br>

        <button type="submit">
            Calculate
        </button>

    </form>


    <h3>
     Result: <span th:text="${result}"></span>
    </h3>

</div>

</body>
</html>
